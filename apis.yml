name: Bstow
description: >-
  Bstow is a fintech-for-good startup whose flagship product, Cheerful Giving, lets nonprofits
  and their supporters raise money through spare-change round-up donations, recurring gifts, and
  branded campaign pages. Backed by 500 Global, Bstow's Cheerful Giving product now operates as
  part of the Goodworld social-impact platform (goodworldnow.com), which layers on giving forms,
  events, peer-to-peer and workplace/payroll giving, text engagement, and an impact CRM. The
  platform documents webhooks and partner integrations (Salesforce, Stripe, PayPal, Klaviyo,
  Zapier, Fundraise Up) but does not publish a public, self-serve API reference or OpenAPI
  specification; API access is arranged directly with the vendor through a sales-gated developer
  portal. This profile was surfaced from the 500 Global portfolio and enriched by the pipeline.
